name: Analisa e Testa
# Esse fluxo não roda sozinho, precisa ser chamado a partir de outro.
# Por exemplo:
#
# jobs:
#   analisa-e-testa:
#     name: Analisa e Testa código
#     uses: ./.github/workflows/analisa-e-testa.yml
#
# Ele assume a seguinte estrutura de pastas no repositório:
#
#   .
#   └── Projeto/   <-- código fonte do jogo em Godot
#
# Também assume que o jogo é em Godot 4 usando GDScript e não C#.

on:
  workflow_call: {}

jobs:
  analise-estatica:
    name: Análise Estática
    runs-on: ubuntu-latest
    steps:
      - name: Obtendo repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Instalando GDScript Toolkit
        uses: Scony/godot-gdscript-toolkit@master

      - name: Analisando código estaticamente
        run: gdlint Projeto/
